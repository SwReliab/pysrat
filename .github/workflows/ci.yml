name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]      # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.13"]     # oldest and newest supported

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install build tools
        run: python -m pip install -U pip cmake ninja

      # Builds the C++ extensions, so this also catches compilation failures.
      - name: Install package with test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest tests -q
