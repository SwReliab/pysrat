name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    name: Check tag matches pyproject version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The package version comes from pyproject.toml, not from the tag, so a
      # mismatch would publish something other than what the tag says.
      - name: Compare
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if tag != f"v{version}":
              sys.exit(
                  f"tag {tag!r} does not match pyproject.toml version {version!r}; "
                  f"expected tag v{version}"
              )
          print(f"tag {tag} matches version {version}")
          PY

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [check-version]

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache cibuildwheel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/cibuildwheel
            ~/Library/Caches/cibuildwheel
            ~\AppData\Local\pypa\cibuildwheel\Cache
          key: ${{ runner.os }}-cibw-${{ hashFiles('pyproject.toml', '.github/workflows/release.yml') }}
          restore-keys: |
            ${{ runner.os }}-cibw-

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "pp* *musllinux*"

          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"

          CIBW_BEFORE_BUILD: |
            python -m pip install -U pip
            python -m pip install -U cmake ninja

          CIBW_BUILD_FRONTEND: "build"
          CIBW_BUILD_VERBOSITY: "1"

          CIBW_ENVIRONMENT: >
            PIP_PREFER_BINARY=1
            PIP_ONLY_BINARY="numpy,scipy"

          # Run the test suite against each built wheel, not just an import
          # check. cibuildwheel skips this for cross-compiled wheels.
          CIBW_TEST_REQUIRES: "pytest pandas"
          CIBW_TEST_COMMAND: >
            python -c "import pysrat, pysrat._core, pysrat.marlib_cf1, pysrat.nhpp; print('import ok')" &&
            pytest {project}/tests -q

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: [check-version]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]

    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}